releaseNotes: "## Python SDK Changes:\n* `sdk.llm.evals.create_suite()`: \n  *  `request.manifest.tasks[].metrics[].requires_target` **Added**\n* `sdk.llm.evals.create_suite_version()`: \n  *  `request.manifest.tasks[].metrics[].requires_target` **Added**\n* `sdk.llm.evals.list_suite_leaderboard_runs()`:  `response.data[].candidates` **Added**\n* `sdk.llm.evals.create_run()`: \n  *  `request` **Changed**\n  *  `response.candidates` **Added**\n* `sdk.llm.evals.list_runs()`:  `response.data[].candidates` **Added**\n* `sdk.llm.evals.get_run()`:  `response.candidates` **Added**\n* `sdk.llm.evals.cancel_run()`:  `response.candidates` **Added**\n* `sdk.llm.evals.rerun_failed_samples()`:  `response.candidates` **Added**\n* `sdk.llm.evals.retry_failed_run()`:  `response.candidates` **Added**\n* `sdk.llm.evals.import_agent_run()`:  `response.candidates` **Added**\n* `sdk.llm.evals.append_agent_trials()`:  `response.candidates` **Added**\n* `sdk.llm.evals.list_schedule_runs()`:  `response.data[].candidates` **Added**\n"
