examples:
  llm.grant:
    speakeasy-default-llm-grant:
      requestBody:
        application/json: {"resourceType": "completion", "resourceId": "my-completion-123", "userId": "user-abc456", "role": "writer"}
  llm.revoke:
    speakeasy-default-llm-revoke:
      requestBody:
        application/json: {"resourceType": "completion", "resourceId": "my-completion-123", "userId": "user-abc456", "role": "reader"}
  llm.check:
    speakeasy-default-llm-check:
      parameters:
        query:
          resourceType: "conversation"
          resourceId: "<id>"
          role: "writer"
      responses:
        "200":
          application/json: {"allowed": true}
  createChatCompletion:
    speakeasy-default-create-chat-completion:
      requestBody:
        application/json: {"model": "meetkai:functionary-urdu-mini-pak", "messages": [{"role": "user", "content": "What is the capital of France?"}], "max_tokens": 100, "temperature": 0.7, "parallel_tool_calls": true}
      responses:
        "200":
          application/json: {"id": "chatcmpl-abc123", "object": "chat.completion", "created": 1704067200, "model": "meetkai:functionary-urdu-mini-pak", "choices": [{"index": 0, "message": {"role": "assistant", "content": "The capital of France is Paris."}, "finish_reason": "stop"}], "usage": {"prompt_tokens": 15, "completion_tokens": 8, "total_tokens": 23}, "resolved_model": "meetkai:functionary-urdu-mini-pak", "resolved_provider": "meetkai", "resolved_serving_location": "aws:us-west-2"}
          text/event-stream: "<value>"
  createChatCompletionStream:
    speakeasy-default-create-chat-completion-stream:
      requestBody:
        application/json: {"model": "meetkai:functionary-urdu-mini-pak", "messages": [{"role": "user", "content": "What is the capital of France?"}], "max_tokens": 100, "temperature": 0.7, "parallel_tool_calls": true}
  conversations.create:
    speakeasy-default-conversations-create:
      requestBody:
        application/json: {"metadata": {"session_id": "abc123", "user_type": "premium"}}
      responses:
        "200":
          application/json: {"id": "conv_abc123", "object": "conversation", "created_at": 1704067200, "metadata": {"session_id": "abc123", "user_type": "premium"}, "deleted_at": null}
  conversations.list:
    speakeasy-default-conversations-list:
      parameters:
        query:
          after: "conv_abc123"
          limit: 20
          order: "desc"
          metadata: {"user_type": "premium"}
          search: "weather forecast"
      responses:
        "200":
          application/json: {"object": "list", "data": [{"id": "conv_abc123", "object": "conversation", "created_at": 1704067200, "metadata": {"session_id": "abc123"}, "deleted_at": 4928.64}], "has_more": true, "last_id": "conv_abc123"}
  conversations.retrieve:
    speakeasy-default-conversations-retrieve:
      parameters:
        path:
          conversation_id: "conv_abc123"
      responses:
        "200":
          application/json: {"id": "conv_abc123", "object": "conversation", "created_at": 1704067200, "metadata": {"session_id": "abc123", "user_type": "premium"}, "deleted_at": null}
  conversations.update:
    speakeasy-default-conversations-update:
      parameters:
        path:
          conversation_id: "conv_abc123"
      requestBody:
        application/json: {"metadata": {"key": "<value>", "key1": "<value>"}}
      responses:
        "200":
          application/json: {"id": "conv_abc123", "object": "conversation", "created_at": 1704067200, "metadata": {"session_id": "abc123", "user_type": "premium"}, "deleted_at": null}
  conversations.delete:
    speakeasy-default-conversations-delete:
      parameters:
        path:
          conversation_id: "conv_abc123"
      responses:
        "200":
          application/json: {"id": "conv_abc123", "object": "conversation.deleted", "deleted": true}
  conversations.items.list:
    speakeasy-default-conversations-items-list:
      parameters:
        path:
          conversation_id: "conv_abc123"
        query:
          after: "item_abc123"
          include: ["content", "metadata"]
          limit: 50
          order: "desc"
      responses:
        "200":
          application/json: {"object": "list", "data": [{"type": "message", "role": "user", "content": "Hello, how are you?", "id": "item_abc123"}], "has_more": false, "last_id": "item_abc123"}
  conversations.items.create:
    speakeasy-default-conversations-items-create:
      parameters:
        path:
          conversation_id: "conv_abc123"
      requestBody:
        application/json: {"items": [{"type": "message", "role": "user", "content": "What is the weather today?"}]}
      responses:
        "200":
          application/json: {"object": "list", "data": [{"type": "message", "role": "user", "content": "Hello, how are you?", "id": "item_abc123"}], "has_more": false, "last_id": "item_abc123"}
  conversations.items.deleteMany:
    speakeasy-default-conversations-items-delete-many:
      parameters:
        path:
          conversation_id: "conv_abc123"
      requestBody:
        application/json: {"item_ids": []}
      responses:
        "200":
          application/json: {"id": "conv_abc123", "object": "conversation", "created_at": 1704067200, "metadata": {"session_id": "abc123", "user_type": "premium"}, "deleted_at": null}
  conversations.items.retrieve:
    speakeasy-default-conversations-items-retrieve:
      parameters:
        path:
          conversation_id: "conv_abc123"
          item_id: "item_abc123"
      responses:
        "200":
          application/json: {"type": "custom_tool_call_output", "call_id": "<id>", "output": "<value>", "id": "<id>"}
  conversations.items.delete:
    speakeasy-default-conversations-items-delete:
      parameters:
        path:
          conversation_id: "conv_abc123"
          item_id: "item_abc123"
      responses:
        "200":
          application/json: {"id": "conv_abc123", "object": "conversation", "created_at": 1704067200, "metadata": {"session_id": "abc123", "user_type": "premium"}, "deleted_at": null}
  listEmbeddingModels:
    speakeasy-default-list-embedding-models:
      responses:
        "200":
          application/json: {"object": "list", "data": []}
  embed:
    speakeasy-default-embed:
      requestBody:
        application/json: {"input": "The quick brown fox jumps over the lazy dog.", "model": "auto", "encoding_format": "float"}
      responses:
        "200":
          application/json: {"data": [{"object": "embedding", "embedding": [0.0023, -0.0091, 0.0156, -0.0042, 0.0089], "index": 0}], "model": "auto", "object": "list", "usage": {"prompt_tokens": 8, "total_tokens": 8}}
  createCompletionFeedback:
    speakeasy-default-create-completion-feedback:
      requestBody:
        application/json: {"id": "chatcmpl-abc123def456", "rating": "thumbs_up", "description": "The response was accurate and helpful."}
      responses:
        "201":
          application/json: {"id": "<id>"}
  getCompletionFeedback:
    speakeasy-default-get-completion-feedback:
      parameters:
        path:
          id: "chatcmpl-abc123def456"
      responses:
        "200":
          application/json: {"id": "<id>"}
  updateCompletionFeedback:
    speakeasy-default-update-completion-feedback:
      parameters:
        path:
          id: "chatcmpl-abc123def456"
      requestBody:
        application/json: {}
